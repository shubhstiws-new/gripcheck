[project]
name = "robotic-umi-event-bench"
version = "0.1.0"
description = "5D benchmark: Ray vs Flink for real-time event detection on Stanford UMI robotics data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "pynvml>=13.0.1",
    "ray[data,default]>=2.54.0",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "zarr>=3.1.5",
]
