[project]
name = "gripcheck"
version = "0.1.0"
description = "Quality scoring for robot manipulation demonstrations (Stanford UMI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imagecodecs>=2026.1.14",
    "numcodecs[zfpy,zstd]<0.14",
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "psutil>=7.2.2",
    "pyarrow>=23.0.1",
    "pynvml>=13.0.1",
    "ray[data,default]>=2.54.0",
    "tqdm>=4.67.3",
    "torch>=2.5.0",
    "typer>=0.24.1",
    "zarr<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
